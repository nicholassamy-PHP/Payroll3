<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX PAY - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .navbar h1 { font-size: 24px; }
    .navbar button { background: white; color: #1e40af; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .navbar button:hover { background: #e2e8f0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .trial-banner { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .trial-banner.expired { background: #fee2e2; border-left-color: #dc2626; }
    .trial-banner h2 { color: #1e40af; margin-bottom: 10px; }
    .trial-banner p { color: #64748b; margin-bottom: 15px; }
    .trial-banner button { background: #1e40af; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .trial-banner button:hover { background: #1e3a8a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { color: #1e40af; margin-bottom: 15px; font-size: 18px; }
    .card-info { margin-bottom: 10px; display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    .card-info label { font-weight: 600; color: #1e40af; }
    .card-info span { color: #64748b; }
    .card button { background: #1e40af; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; }
    .card button:hover { background: #1e3a8a; }
    .edit-btn { background: #64748b; padding: 8px 12px; font-size: 14px; width: auto; margin-top: 10px; }
    .edit-btn:hover { background: #475569; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .modal-close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    .modal-close:hover { color: black; }
    .modal-header { margin-bottom: 20px; }
    .modal-header h2 { color: #1e40af; margin-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; color: #1e40af; font-weight: 600; margin-bottom: 8px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1e40af; }
    .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-buttons button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .save-btn { background: #1e40af; color: white; }
    .save-btn:hover { background: #1e3a8a; }
    .cancel-btn { background: #e2e8f0; color: #1e40af; }
    .cancel-btn:hover { background: #cbd5e1; }
    .site-footer { max-width: 1200px; margin: 10px auto 90px; padding: 0 20px; text-align: right; display: flex; gap: 18px; justify-content: flex-end; flex-wrap: wrap; }
    .site-footer a { color: #64748b; font-size: 13px; text-decoration: none; }
    .site-footer a:hover { color: #1e40af; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="langSwitch"></div>
  <div class="navbar">
    <h1 data-i18n="dashboard_title">ApexPayGo Dashboard</h1>
    <button onclick="logout()" data-i18n="logout">Logout</button>
  </div>

  <div class="container">
    <div id="trialBanner" class="trial-banner">
      <h2 id="trialTitle"></h2>
      <p id="trialText"></p>
      <button id="upgradeBtn" style="display: none;" onclick="goToCheckout()" data-i18n="upgrade_now">Upgrade Now</button>
    </div>

    <div class="grid">
      <div class="card">
        <h3 data-i18n="company_info">Company Information</h3>
        <div class="card-info">
          <label data-i18n="label_company_name">Company Name:</label>
          <span id="companyName">-</span>
        </div>
        <div class="card-info">
          <label data-i18n="label_company_type">Company Type:</label>
          <span id="companyType">-</span>
        </div>
        <div class="card-info">
          <label data-i18n="label_address">Address:</label>
          <span id="companyAddress">-</span>
        </div>
        <div class="card-info">
          <label data-i18n="label_industry">Industry:</label>
          <span id="industry">-</span>
        </div>
        <button class="edit-btn" onclick="openEditModal()" data-i18n="edit_company_info">Edit Company Info</button>
      </div>

      <div class="card">
        <h3 data-i18n="account_info">Account Information</h3>
        <div class="card-info">
          <label data-i18n="label_name">Name:</label>
          <span id="userName">-</span>
        </div>
        <div class="card-info">
          <label data-i18n="label_email">Email:</label>
          <span id="userEmail">-</span>
        </div>
        <div class="card-info">
          <label data-i18n="label_status">Status:</label>
          <span id="accountStatus"></span>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="payroll_system">Payroll System</h3>
        <div class="card-info">
          <label data-i18n="label_payroll_processing">Payroll Processing:</label>
          <span id="payrollStatus" data-i18n="payroll_ready">Ready</span>
        </div>
        <button onclick="goToPayroll()" data-i18n="open_payroll_system">Open Payroll System</button>
      </div>
    </div>
  </div>

  <div class="site-footer">
    <a href="/confidentialite" data-i18n="footer_privacy_fr">Politique de confidentialité (FR)</a>
    <a href="/privacy" data-i18n="footer_privacy_en">Privacy Policy (EN)</a>
    <a href="/contact" data-i18n="footer_contact">Contact Us</a>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeEditModal()">&times;</span>
      <div class="modal-header">
        <h2 data-i18n="edit_company_title">Edit Company Information</h2>
      </div>
      <form id="editForm">
        <div class="form-group">
          <label for="editCompanyName" data-i18n="company_name">Company Name</label>
          <input type="text" id="editCompanyName" name="companyName" required>
        </div>
        <div class="form-group">
          <label for="editCompanyType" data-i18n="company_type">Company Type</label>
          <select id="editCompanyType" name="companyType" required>
            <option value="single" data-i18n="single_company">Single Company</option>
            <option value="multi" data-i18n="multi_company">Multi-Company</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editCompanyAddress" data-i18n="company_address_label">Company Address</label>
          <input type="text" id="editCompanyAddress" name="companyAddress" required>
        </div>
        <div class="form-group">
          <label for="editIndustry" data-i18n="industry">Industry</label>
          <select id="editIndustry" name="industry" required>
            <option value="" data-i18n="select_ph">Select...</option>
            <option value="technology" data-i18n="ind_technology">Technology</option>
            <option value="healthcare" data-i18n="ind_healthcare">Healthcare</option>
            <option value="finance" data-i18n="ind_finance">Finance</option>
            <option value="retail" data-i18n="ind_retail">Retail</option>
            <option value="manufacturing" data-i18n="ind_manufacturing">Manufacturing</option>
            <option value="education" data-i18n="ind_education">Education</option>
            <option value="other" data-i18n="ind_other">Other</option>
          </select>
        </div>
        <div class="modal-buttons">
          <button type="button" class="cancel-btn" onclick="closeEditModal()" data-i18n="cancel">Cancel</button>
          <button type="submit" class="save-btn" data-i18n="save_changes">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script>
    function calculateTrialDaysRemaining(trialStartDate) {
      if (!trialStartDate) return 7;
      const startDate = new Date(trialStartDate);
      if (isNaN(startDate.getTime())) return 7;
      const today = new Date();
      const diffTime = startDate.getTime() + (7 * 24 * 60 * 60 * 1000) - today.getTime();
      const daysRemaining = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return Math.max(0, daysRemaining);
    }

    function updateTrialStatus() {
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      const trialBanner = document.getElementById('trialBanner');
      const trialTitle = document.getElementById('trialTitle');
      const trialText = document.getElementById('trialText');
      const upgradeBtn = document.getElementById('upgradeBtn');
      const accountStatus = document.getElementById('accountStatus');

      // A paid subscription always wins, regardless of the 7-day trial clock.
      if (company.subscription_status === 'active') {
        trialBanner.classList.remove('expired');
        trialTitle.textContent = i18n.t('py_subscribed_title');
        trialText.textContent = i18n.t('py_subscribed_text');
        upgradeBtn.style.display = 'none';
        accountStatus.textContent = i18n.t('status_subscribed');
        return;
      }

      const daysLeft = calculateTrialDaysRemaining(company.trial_start_date);

      if (daysLeft <= 0) {
        trialBanner.classList.add('expired');
        trialTitle.textContent = i18n.t('trial_expired_title');
        trialText.textContent = i18n.t('trial_expired_text');
        upgradeBtn.style.display = 'block';
        accountStatus.textContent = i18n.t('status_trial_expired');
      } else {
        trialBanner.classList.remove('expired');
        trialTitle.textContent = i18n.t('trial_active_title');
        trialText.textContent = i18n.t('trial_days_remaining', { days: daysLeft });
        upgradeBtn.style.display = 'block';
        accountStatus.textContent = i18n.t('status_active');
      }
    }

    // Fetch the company's live billing status from the server — localStorage
    // is a stale cache from login/setup and never reflects a payment made
    // just now (e.g. returning from Stripe Checkout).
    async function refreshCompanyStatus() {
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      if (!company.id) return;
      try {
        const res = await fetch(`/api/company?companyId=${company.id}`, {
          headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '') }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.company) localStorage.setItem('company', JSON.stringify(data.company));
        }
      } catch (e) {
        console.log('Could not refresh billing status:', e);
      }
    }

    function loadDashboard() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const company = JSON.parse(localStorage.getItem('company') || '{}');

      document.getElementById('userName').textContent = user.name || '-';
      document.getElementById('userEmail').textContent = user.email || '-';
      document.getElementById('companyName').textContent = company.company_name || '-';
      document.getElementById('companyType').textContent = company.company_type === 'single' ? i18n.t('single_company') : i18n.t('multi_company');
      document.getElementById('companyAddress').textContent = company.company_address || '-';
      document.getElementById('industry').textContent = company.industry || '-';

      updateTrialStatus();
    }

    document.addEventListener('langchange', loadDashboard);

    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('user');
      localStorage.removeItem('company');
      window.location.href = '/';
    }

    function goToPayroll() {
      window.location.href = '/payroll';
    }

    function goToCheckout() {
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      const user = JSON.parse(localStorage.getItem('user') || '{}');

      fetch('/api/stripe-checkout', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
        },
        body: JSON.stringify({
          userId: user.id,
          companyId: company.id,
          email: user.email
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.checkoutUrl) {
          window.location.href = data.checkoutUrl;
        } else {
          alert('Error: ' + (data.error || 'Could not create checkout'));
        }
      })
      .catch(err => alert('Error: ' + err.message));
    }

    refreshCompanyStatus().then(async () => {
      loadDashboard();
      // Returning from Stripe: the webhook can land a second or two after
      // the redirect, so retry once shortly after if we're not active yet.
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      if (new URLSearchParams(location.search).get('billing') === 'success' && company.subscription_status !== 'active') {
        setTimeout(() => { refreshCompanyStatus().then(loadDashboard); }, 3000);
      }
    });

    function openEditModal() {
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      document.getElementById('editCompanyName').value = company.company_name || '';
      document.getElementById('editCompanyType').value = company.company_type || '';
      document.getElementById('editCompanyAddress').value = company.company_address || '';
      document.getElementById('editIndustry').value = company.industry || '';
      document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const company = JSON.parse(localStorage.getItem('company') || '{}');
      const companyName = document.getElementById('editCompanyName').value.trim();
      const companyType = document.getElementById('editCompanyType').value;
      const companyAddress = document.getElementById('editCompanyAddress').value.trim();
      const industry = document.getElementById('editIndustry').value;

      try {
        const response = await fetch('/api/update-company', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (localStorage.getItem('authToken') || '')
          },
          body: JSON.stringify({
            companyId: company.id,
            companyName,
            companyType,
            companyAddress,
            industry
          })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('company', JSON.stringify(data.company));
          loadDashboard();
          closeEditModal();
          alert(i18n.t('update_success'));
        } else {
          alert(i18n.t('generic_error') + ': ' + (data.error || i18n.t('update_failed')));
        }
      } catch (error) {
        alert(i18n.t('generic_error') + ': ' + error.message);
      }
    });
  </script>
  <script src="/samy.js"></script>
</body>
</html>
